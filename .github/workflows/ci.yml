name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_DEBUG: '1'
      DB_CONNECTION: pgsql
      # When using GitHub Actions services, use the service hostname ("postgres")
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: testing
      DB_USERNAME: postgres
      DB_PASSWORD: secret
      # Redis service hostname in Actions
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: sync

    services:
      postgres:
        # Use a broadly-available alpine tag to reduce image-not-found risk
        image: postgres:15-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret

      redis:
        image: redis:alpine

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, bcmath, pdo, pdo_pgsql
          tools: composer:v2

      - name: Setup Bun (JS runtime/package manager)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      - name: Cache Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb', '**/package.json') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install JS dependencies (bun)
        run: bun install

      - name: Copy environment file
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Generate App Key
        run: php artisan key:generate --ansi

      - name: Wait for database and run migrations
        # Attempt migrations repeatedly to wait for the postgres service
        run: |
          for i in {1..30}; do
            php artisan migrate --force && break || sleep 2
          done

      - name: Build frontend assets
        run: bun run build

      - name: Run PHP linter (Pint)
        run: composer lint

      - name: Run frontend linter
        run: bun run lint

      - name: Type check frontend
        run: bun run types:check

      - name: Run tests (Pest)
        run: ./vendor/bin/pest --colors=always

      - name: Upload test results (junit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pest-results
          path: tests/*.xml
